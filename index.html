<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="GuitarJon - Tienda de guitarras, pedales y equipo musical.">

  <title>GuitarJon | Inicio</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="navbar">

  <h1>🎸 GuitarJon</h1>

  <nav aria-label="Menú principal">
    <a href="index.html" class="activo">Inicio</a>
    <a href="quienes-somos.html">Quiénes Somos</a>
    <a href="servicios.html">Nuestros Servicios</a>
    <a href="contacto.html">Contacto</a>
  </nav>

  <input
    type="text"
    id="busqueda"
    placeholder="Buscar productos..."
    aria-label="Buscar productos"
  >

  <select id="filtro" aria-label="Filtrar productos">
    <option value="todos">Todo</option>
    <option value="guitarra">Guitarras</option>
    <option value="pedal">Pedales</option>
  </select>

  <button
    type="button"
    class="btn-nav"
    id="btnTema"
    aria-label="Cambiar tema"
  >
    ☀️
  </button>

  <button
    type="button"
    id="btnCarrito"
    class="btn-carrito"
    aria-label="Abrir carrito"
    aria-expanded="false"
  >
    🛒
    <span id="badgeCarrito" class="badge-carrito" hidden>0</span>
  </button>

</header>


<main class="main">

  <aside class="sidebar">

    <h3>Categorías</h3>

    <ul>
      <li onclick="filtrarCategoria('todos')">
        Todos
      </li>

      <li onclick="filtrarCategoria('guitarra')">
        Guitarras
      </li>

      <li onclick="filtrarCategoria('pedal')">
        Pedales
      </li>
    </ul>

  </aside>


  <section
    class="productos"
    id="productos"
    aria-label="Productos"
  ></section>

</main>


<div
  id="carritoBackdrop"
  class="carrito-backdrop"
  hidden
></div>


<aside
  class="carrito"
  id="carrito"
  aria-hidden="true"
>

  <button
    type="button"
    id="btnCerrarCarrito"
    class="btn-cerrar-carrito"
    aria-label="Cerrar carrito"
  >
    ×
  </button>

  <h2>🛒 Carrito</h2>

  <ul id="lista"></ul>

  <h3>
    Total: $<span id="total">0</span>
  </h3>

  <button
    type="button"
    onclick="pagar()"
  >
    Pagar 💳
  </button>

</aside>


<footer class="footer">

  <p>
    GuitarJon - Proyecto de Jon
  </p>

</footer>


<script src="script.js"></script>

</body>
</html>
