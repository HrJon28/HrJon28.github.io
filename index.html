<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tienda PRO 🎸</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- =====================================================
       NAVBAR
       ===================================================== -->

  <header class="navbar">

    <h1>🎸 GuitarJon</h1>

    <input
      type="text"
      id="busqueda"
      placeholder="Buscar pedales, guitarras..."
      aria-label="Buscar productos"
    >

    <select
      id="filtro"
      aria-label="Filtrar productos"
    >
      <option value="todos">Todo</option>
      <option value="guitarra">Guitarras</option>
      <option value="pedal">Pedales</option>
    </select>


    <!-- Modo oscuro / claro -->

    <button
      type="button"
      id="btnTema"
      class="btn-nav"
      aria-label="Cambiar a modo claro"
    >
      ☀️
    </button>


    <!-- Favoritos -->

    <button
      type="button"
      id="btnFavoritos"
      class="btn-nav"
      aria-label="Mostrar favoritos"
    >
      ❤️
    </button>


    <!-- Carrito -->

    <button
      type="button"
      id="btnCarrito"
      class="btn-carrito"
      aria-label="Abrir carrito"
      aria-expanded="false"
      aria-controls="carrito"
    >

      <svg
        class="icono-carrito"
        xmlns="http://www.w3.org/2000/svg"
        width="26"
        height="26"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >

        <circle cx="9" cy="21" r="1"/>
        <circle cx="20" cy="21" r="1"/>

        <path
          d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"
        />

      </svg>

      <span
        id="badgeCarrito"
        class="badge-carrito"
        hidden
      >
        0
      </span>

    </button>

  </header>


  <!-- =====================================================
       CONTENIDO PRINCIPAL
       ===================================================== -->

  <div class="main">


    <!-- SIDEBAR -->

    <aside class="sidebar">

      <h3>Categorías</h3>

      <ul>

        <li onclick="filtrarCategoria('todos')">
          Todos
        </li>

        <li onclick="filtrarCategoria('guitarra')">
          Guitarras
        </li>

        <li onclick="filtrarCategoria('pedal')">
          Pedales
        </li>

      </ul>

    </aside>


    <!-- PRODUCTOS -->

    <section
      class="productos"
      id="productos"
    ></section>


    <!-- FONDO DEL CARRITO -->

    <div
      id="carritoBackdrop"
      class="carrito-backdrop"
      hidden
    ></div>


    <!-- =====================================================
         CARRITO
         ===================================================== -->

    <aside
      class="carrito"
      id="carrito"
      aria-hidden="true"
    >

      <button
        type="button"
        id="btnCerrarCarrito"
        class="btn-cerrar-carrito"
        aria-label="Cerrar carrito"
      >
        &times;
      </button>


      <h2>🛒 Carrito</h2>


      <ul id="lista"></ul>


      <h3>
        Total:
        $<span id="total">0</span>
      </h3>


      <button
        type="button"
        onclick="pagar()"
      >
        Pagar 💳
      </button>

    </aside>

  </div>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="footer">

    <p>
      GuitarJon - Proyecto de Jon
    </p>

  </footer>


  <!-- =====================================================
       JAVASCRIPT EXTERNO
       ===================================================== -->

  <script src="script.js"></script>

</body>

</html>
